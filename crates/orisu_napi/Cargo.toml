[package]
name = "orisu_napi"
description = "Node bindings of orisu: compiler, scanner, canonicalize, merge, check and the language server."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
orisu_allocator.workspace = true
orisu_candidate.workspace = true
orisu_canonical.workspace = true
orisu_compat_tailwind.workspace = true
orisu_compiler.workspace = true
orisu_lsp.workspace = true
orisu_merge.workspace = true
orisu_registry.workspace = true
orisu_scanner.workspace = true
napi = { version = "3.13", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = "3.6"
serde_json.workspace = true

[build-dependencies]
napi-build = "2.5"
