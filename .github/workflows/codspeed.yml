name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shllcd/actions/setup-rust@2646c40361e38224059283a1d1073a8d4b3d6cb9 # v1.1.0
        with:
          tools: cargo-codspeed@6.0.0
      - name: Build benchmarks
        run: cargo codspeed build -p xtask
      - uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        with:
          mode: simulation
          run: cargo codspeed run -p xtask
