name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shllcd/actions/setup-rust@2646c40361e38224059283a1d1073a8d4b3d6cb9 # v1.1.0
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace -- -D warnings
      - name: Generated files
        run: cargo xtask codegen --check
      - name: Typecheck
        working-directory: packages/orisu
        run: |
          npm install --ignore-scripts
          npm run typecheck

  release:
    name: Release
    needs: verify
    permissions:
      contents: write
      id-token: write
    uses: shllcd/actions/.github/workflows/napi-release.yml@2646c40361e38224059283a1d1073a8d4b3d6cb9 # v1.1.0
    with:
      crate: orisu_napi
      package-dir: packages/orisu
      napi-name: orisu
      binding-name: '@orisu/binding-{platform}'
      zig-version: 0.15.2
      build-command: npm install --ignore-scripts && npm run build
